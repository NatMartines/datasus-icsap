version: 2

models:
  - name: dim_municipio
    description: Um município por linha (IBGE).
    columns:
      - name: cod_municipio
        tests: [unique, not_null]

  - name: dim_hospital
    description: Um hospital por linha (CNES).
    columns:
      - name: cod_hospital
        tests: [unique, not_null]

  - name: dim_doenca
    description: Uma doença (CID-10) por linha, com categoria, grupo, capítulo e indicação de evitável.
    columns:
      - name: cod_cid
        tests: [unique, not_null]

  - name: fct_internacoes
    description: Uma linha por internação (AIH tipo 1), SP 2024.
    columns:
      - name: num_aih
        tests: [unique, not_null]
      - name: cod_municipio_residencia
        tests:
          - relationships:
              arguments:
                to: ref('dim_municipio')
                field: cod_municipio
      - name: cod_hospital
        tests:
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: cod_hospital
              config:
                severity: warn
      - name: cod_cid_principal
        description: CID-10 principal. 121 internações usam códigos novos (N18.2-N18.5, U09, U10) ausentes da tabela CID do DATASUS.
        tests:
          - relationships:
              arguments:
                to: ref('dim_doenca')
                field: cod_cid
              config:
                severity: warn